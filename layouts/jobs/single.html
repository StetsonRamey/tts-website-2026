{{ define "main" }}
<main id="main-content">
    {{ partial "breadcrumbs.html" . }} {{/* ── Hero ── */}}
    <section class="hero region bg-light" aria-label="Jobs">
        <div class="wrapper text-center flow">
            <p class="overline">Join Our Team</p>
            <h1 data-balance>Work With Us</h1>
            <p>
                We're always looking for dependable people to join our crew for the holiday season. Fill out the
                application below and we'll be in touch.
            </p>
        </div>
    </section>

    {{/* ── Application Form Embed ── */}}
    <section class="region" aria-label="Job application form">
        <div class="wrapper flow" style="--wrapper-max: 50rem">
            <div
                class="jobs-form"
                data-zite-id="26lkxpvj47"
                data-zite-embed-type="standard"
                data-zite-inherit-parameters></div>
            <script src="https://server.fillout.com/embed/v2-zite/"></script>
        </div>
    </section>
</main>
{{ end }}
