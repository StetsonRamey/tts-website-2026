{{- if not .IsHome -}}
<nav aria-label="Breadcrumb">
  <ol role="list">
    <li><a href="/">Home</a></li>
    {{- $ancestors := .Ancestors.Reverse -}}
    {{- range $ancestors -}}
      {{- if not .IsHome }}
    <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
      {{- end -}}
    {{- end }}
    <li aria-current="page">{{ .Title }}</li>
  </ol>
</nav>
{{- end -}}
